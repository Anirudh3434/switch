<svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="switch-bridge-grad" x1="4" y1="22" x2="40" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="30%" stop-color="#0ea5e9"/>
      <stop offset="70%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="switch-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0ea5e9" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background subtle squircle frame -->
  <rect width="44" height="44" rx="12" fill="#0c1017"/>
  <rect width="44" height="44" rx="12" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  
  <!-- Group with glow and solid gradient -->
  <g filter="url(#switch-glow)">
    <!-- Seamless 2D Solid Session Bridge Ribbon -->
    <path d="M 12 22 C 12 16.5 16 14 20.5 14 C 23.5 14 25.5 15.5 27 18 L 17 26 C 18.5 28.5 20.5 30 23.5 30 C 28 30 32 27.5 32 22" 
          stroke="url(#switch-bridge-grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Left Session Node (Browser 1) -->
    <circle cx="10" cy="22" r="4.5" fill="#00f2fe"/>
    <!-- Right Session Node (Browser 2) -->
    <circle cx="34" cy="22" r="4.5" fill="#a855f7"/>
    <!-- Inner Core Bridge diagonal -->
    <path d="M 17 26 L 27 18" stroke="url(#switch-bridge-grad)" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
